<div
  class="d-flex flex-column align-items-start p-3 bg-light"
  style="height: 100vh; width: 250px"
>
  <a
    *ngFor="let item of menuItems"
    [href]="item.link"
    class="mb-2 text-decoration-none d-flex align-items-center"
  >
    <i [class]="item.icon + ' mr-2'"></i>
    <span>{{ item.label }}</span>
  </a>
</div>
